# AgentDesk configuration. Times are US/Central (America/Chicago).
# Every number here is a knob; the defaults encode the rules from your spec.

mode: paper               # sim | paper | shadow | live   (CLI --mode overrides). Paper first; live only after a deposit + sizing review
symbol: SPY
live_enabled: false       # must be true AND --mode live to send real orders

data:
  provider: alpaca        # sim | alpaca | massive   (paper/shadow/live need a real SPY trade feed)
  history_days: 5         # 1m history pulled at startup to warm up 15m/5m MACD
  alpaca:
    feed: iex             # iex = free (a small slice of prints -> 144t bars form far slower). sip = all exchanges (Algo Trader Plus, $99/mo); switch before live
    clean_prints: true    # drop prints that don't set the last price + isolated bad prints before bars are built (feeds/prints.py)
    options_feed: indicative   # only used if quotes_source: alpaca. Paper uses Robinhood's real option quotes (quotes_source auto)
  massive:                # formerly Polygon.io
    rest_url: https://api.massive.com
    ws_url: wss://socket.massive.com/stocks
  quotes_source: auto     # auto | robinhood | alpaca | massive | sim   (where option bid/ask comes from)

strategy:
  macd: {fast: 12, slow: 26, signal: 9}
  rsi: {period: 14, lower: 30, upper: 70}
  tick_bar_size: 144
  tick_bar_size_iex: 5                # free Alpaca IEX sees ~3.7% of SPY prints (measured 2026-09-28); 5 IEX ticks catch ~75% of real 144t crosses vs 55% at 8 (approximation)
  filter_timeframes: [15m, 5m]      # MACD must be above signal (live/forming bar)
  trigger_timeframes: [1m, 144t]    # both above signal + a fresh cross-up on either
  rsi_check_timeframes: [15m, 5m, 1m]  # RSI must sit inside [lower, upper]
  confirm_window_sec: 120           # how old a cross can be and still count as "fresh"
  allow_puts: false                 # mirror logic for puts; off because you trade calls
  enabled_setups: [SWING, SCALP]
  entry_window: {start: "08:35", end: "14:30"}

strikes:
  # Offsets from the money: +1 = first OTM strike, 0 = ATM, -1 = first ITM.
  # base = default; max = furthest the level check may push OTM.
  schedule:
    - {from: "08:30", base: 1, max: 2}
    - {from: "10:30", base: 1, max: 1}
    - {from: "12:30", base: 0, max: 0}
    - {from: "13:45", base: -1, max: -1}
  level_buffer: 0.15      # $ a resistance level must clear the strike by to go further OTM
  max_spread_pct: 0.12    # skip / step toward ATM if (ask-bid)/mid is wider than this

sizing:
  max_trade_dollars: 500
  max_contracts: 5
  min_contracts: 1
  fee_per_contract: 0.03  # regulatory pass-through, approx

orders:
  entry_limit: mid_plus   # mid_plus: mid + 35% of spread, capped at ask
  entry_spread_frac: 0.35
  reprice_after_ms: 2500
  max_reprices: 2
  exit_urgent: bid        # stops/flatten go out at the bid

exits:
  stop_loss_pct: 0.20
  flatten_at: "14:40"      # Robinhood force-closes SPY 0DTE at 14:45 CT (sellout_datetime); the engine also flattens 5 min before each contract's own sellout
  swing:                  # entries triggered by a fresh 1m cross
    scale_outs:
      - {at: 0.25, fraction: 0.50}
      - {at: 0.50, fraction: 0.25}
    breakeven_after_first_scale: true
    runner_trail_pct: 0.25          # runner exits if premium drops 25% from its peak
    exit_on_cross_back: 1m
    ripping_hold: true              # 5m hist rising + price > VWAP -> runner waits for 5m cross-back
    time_stop_min: 20
    time_stop_min_gain: 0.10
  scalp:                  # entries triggered by a fresh 144t cross
    scale_outs:
      - {at: 0.15, fraction: 0.50}
    breakeven_after_first_scale: true
    runner_trail_pct: 0.15
    exit_on_cross_back: 144t
    ripping_hold: false
    time_stop_min: 6
    time_stop_min_gain: 0.05

l2:                      # Level 2 book from Robinhood get_equity_price_book
  mode: observe           # off | observe (log + display, never blocks) | enforce (can veto entries)
  poll_ms: 3000           # observe only: 20 calls/min out of the engine's 120/min Robinhood budget (was 1000)
  near_dollars: 0.25      # imbalance measured on levels within this distance of mid
  wall_mult: 4.0          # a wall = level size >= 4x the median level size on that side
  min_wall_shares: 10000  # ...and at least this many shares
  min_imbalance_for_calls: -0.25        # enforce: skip calls when the near book is this ask-heavy
  block_if_ask_wall_within: 0.15        # enforce: skip calls when a wall sits within $0.15 above

risk:
  max_daily_loss: 400
  profit_lock: {trigger: 600, giveback_pct: 0.40}   # after +$600 on the day, stop if you give back 40% of the peak
  max_trades_per_day: 12
  max_open_positions: 1
  loss_streak_cooldown: {losses: 2, minutes: 15}
  event_blackout: {before_min: 10, after_min: 20}
  flatten_before_high_impact_min: 5
  watchdog:               # safety halt + flatten (HANDOFF section 12): the engine is the only stop, so it must never run blind
    quote_stale_sec: 10           # an open position with no usable option quote for this long
    max_consecutive_errors: 3     # broker/API calls failing in a row
    reconcile_sec: 30             # live only: account positions vs engine positions; 2 mismatches in a row halt
  state_path: ~/.agentdesk/risk_state_{mode}.json   # today's P&L, trades, cooldown and halts survive a restart

crew:
  enabled: true
  model: claude-sonnet-5-5          # Macro and Vol briefs, the weekly calendar, book F's news tag (crew review 2026-09-29)
  fast_model: claude-haiku-4-5-20251001
  web_search: true
  # arrive: desks catch up at their own desks; premarket: quick huddle using those briefs, done before the 08:30 open
  schedule: {arrive: "08:15", premarket: "08:25", midday: "11:30", late: "13:15", postclose: "15:05"}
  consult_quant_after_losses: 2
  # Which books each desk's size vote reaches (crew review 2026-09-29). Rates and Fed are folded into Macro and
  # don't vote. A desk not listed (Risk, Tape, Earnings, Post-mortem) reaches book A only. Nothing reaches E or F.
  vote_books: {macro: [A, C], vol: [A, B, C, D, G], quant: [A], ops: [A]}
  calendar_path: ~/.agentdesk/econ_calendar.json   # the week's scheduled US events, one web call a week
  min_size_multiplier: 0.5          # lowest a desk vote can cut size to
  max_size_multiplier: 1.25         # size-up cap; only when every conviction check passes (see crew.py size_up)
  auto_apply_tweaks: true           # per-trade / per-day tweaks inside whitelisted bounds apply without asking
  # Known events if you want them without the API (or to override):
  events: []
  #  - {date: 2026-10-15, time: "07:30", name: "CPI", impact: high}
  ops:                              # Ops desk pre-flight at the 08:15 catch-up (reports; cuts size to 50% only if history is cold)
    min_warm_bars: 50               # 15m and 5m MACD need this many closed bars
    recorder_days_log: ~/.agentdesk/recorder/days.jsonl   # standalone recorder's day log; journal.option_quotes also counts
  earnings:                         # Earnings desk: book E's screen (HANDOFF 7E) from Robinhood get_earnings_calendar
    universe: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, JPM, V, MA, UNH, XOM, LLY, COST,
               NFLX, AMD, ORCL, CRM, ADBE, BAC, WMT, HD, PG, JNJ, KO, PEP, DIS, INTC, QCOM]   # starting list; book E finalizes
    heavyweights: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, JPM, LLY]   # overnight reports flagged for SPY
    calendar: []                    # offline fallback: - {symbol: NVDA, date: 2026-11-18, timing: pm}
  postmortem_dir: ~/.agentdesk/postmortems   # Post-mortem desk writes YYYY-MM-DD.md here after the close

robinhood:
  mcp_url: https://agent.robinhood.com/mcp/trading
  redirect_port: 8766
  token_dir: ~/.agentdesk
  account_number: null      # null = auto-detect the Agentic account
  quote_poll_ms: 1000
  # Robinhood throttles near 240 calls/min per account (probe 2026-09-28). The engine made ~200/min on 2026-09-29 and
  # got RATE_LIMITED 773 times, starving the recorder. The engine keeps to half the ceiling; the recorder (42 quotes
  # every 10 s, book E's IV pass 13:30-15:00 CT at <= 1 call/s) uses its own grant and pacing within the rest.
  call_budget: {per_min: 120, per_s: 3}
  record_option_quotes: true   # log real 0DTE SPY call+put quotes ATM-10..ATM+10 every 10s -> journal.option_quotes
  arg_overrides: {}         # per-tool fixed args if the schema matcher misses one (see rh-inspect)

recorder:
  # Book E's end-of-day ATM IV (journal.iv_history), inside the standalone record-quotes job. Read-only.
  iv: {enabled: true, list_from_ct: "13:30", quote_ct: "14:50", stop_ct: "15:00", list_calls_per_s: 0.5,
       quote_calls_per_s: 1, cache_dir: ~/.agentdesk/cache/iv, retry_sec: 30}

# ---------------------------------------------------------------------------------------------
# Paper books (HANDOFF section 9). Book A runs in engine.py; B, C and D run in agentdesk/books/ next to it.
# Book E runs in agentdesk/books/e_host.py. Every B-G fill is simulated; paper_only is enforced.
books:
  account: {paper_balance: 10000, open_risk_cap: 2500, per_position_max_loss: 300, fee_per_leg: 0.04}   # $10k paper (section 11 row); cap = sum of open max losses incl. A
  fills: {model: mid_offset, cents_per_leg: 1, reprice_step_c: 1, max_reprices: 4, max_quote_age_s: 5, max_leg_spread_pct: 0.25, tick_exempt: 0.02}
  history_days: 20        # 1m history the books load at startup (D's 14-day quiet filter, C's indicators)
  A_macd_calls:    {enabled: true,  paper_only: true,  risk_per_trade: 500, max_contracts: 5, daily_loss: 400}
  B_iron_fly:      {enabled: true,  paper_only: true,  lots: 1, entry_ct: "08:45", entry_grace_min: 5, wings: 5, take_profit_pct: 0.50, stop_debit_x_credit: 2.0, close_ct: "14:30", skip_event_before_ct: "14:00", vix1d_gap: 3.0}
  C_orb_bull_put:  {enabled: true,  paper_only: true,  max_loss_budget: 400, width: 2, max_trades_day: 2, window_ct: {start: "09:00", end: "13:30"}, or_minutes: 30, ema: 20, rsi: [55, 72], vol_mult: 0.8, vol_lookback: 20, stop_pct: 0.0018, target_pct: 0.0045, max_hold_min: 45, close_ct: "14:15"}
  C_bear_puts:     {enabled: false, paper_only: true,  note: "failed its backtest; stays off until a pre-registered filter set passes out-of-sample"}
  D_iron_condor:   {enabled: true,  paper_only: true,  lots: 1, entry_ct: "09:00", entry_grace_min: 5, short_em_mult: 0.9, em_rth_mult: 0.80, wings: 2, take_profit_pct: 0.50, stop_debit_x_credit: 2.0, close_ct: "14:25", quiet_filter: true, quiet_window_min: 30, quiet_lookback_days: 14, vwap_max_pct: 0.0012}
  # Book E (HANDOFF 7E; spec docs/superpowers/specs/2026-09-29-book-e-design.md, approved 2026-09-29). Holds for days:
  # positions persist in e_positions and are NOT sold at shutdown; kill/halts/Flatten sell them. Paper only.
  E_earnings_iv:   {enabled: true,  paper_only: true,  max_debit: 500, max_debit_e2: 250, max_open: 3,
                    structures: [straddle_t3, calendar_t10], never_hold_through_announcement: true,
                    entry_ct: "14:45", exit_ct: "14:45", expiry_day_exit_ct: "14:15", half_day_ct: "11:20",
                    e1_dte: [4, 10], take_profit: {straddle_t3: 0.20, calendar_t10: 0.15}, stop_pct: 0.30,
                    vix_max: 30, iv_pct_max: 0.80, iv_min_cycles: 4, max_leg_spread_pct: 0.05, poll_sec: 15,
                    sectors: {tech: [AAPL, MSFT, NVDA, AVGO, ORCL, CRM, ADBE, AMD, INTC, QCOM],
                              comm: [GOOGL, META, NFLX, DIS], discretionary: [AMZN, TSLA, HD],
                              financials: [JPM, V, MA, BAC], health: [UNH, LLY, JNJ], energy: [XOM],
                              staples: [COST, WMT, PG, KO, PEP]}}      # GICS; a name missing here can't trade
  # Book F1 (was F): stocks in play, long whole shares, paper only. docs/BOOK_F_HANDOFF.md section 3 plus the F1 v2
  # changes pre-registered in research/strategy_f1_prereg.md: all liquid US stocks (source: all_us), the top 10 by
  # RVOL5 armed, a stop at the opening-range low (clamped to 0.10-0.50 x ATR14; the published 0.10 x ATR stop is
  # tracked as a shadow), and names with an opening range wider than 0.50 x ATR14 skipped. Sizes and limits unchanged.
  # bars_source: robinhood caps the universe at max_names (the 09:35 scan is 1 call per 10 names); after buying
  # Alpaca Algo Trader Plus, set bars_source: alpaca_sip and the cap is lifted.
  F1_stocks_in_play: {enabled: true,  paper_only: true,  instrument: shares, scan_et: "09:35", rvol5_min: 2.0, top_n: 10, first_candle: green, entry_cutoff_et: "10:30",
                      stop_mode: or_low, stop_atr_frac: 0.10, stop_atr_min: 0.10, stop_atr_max: 0.50, max_or_atr: 0.50,
                      exit_et: "15:55", risk_per_trade: 25, max_notional: 1000, max_positions: 5, daily_loss: 75, bars_source: robinhood,
                      universe: {source: all_us, max_names: 400, min_price: 10, min_atr: 0.50, min_avg_volume: 1000000,
                                 min_dollar_vol_20d: 25000000, top_sp500_by_dollar_vol: 130,
                                 extra: [NVDA, AMD, AVGO, MU, TSM, ARM, MRVL, SMCI, WDC, STX, MSFT, META, GOOGL, AMZN, AAPL, ORCL, PLTR, TSLA]},
                      news_tag: observe, shorts: log_only,
                      prep_et: "08:30", max_quote_age_s: 5, max_sends: 3, cache_dir: ~/.agentdesk/cache/f, max_calls_per_s: 20}
  # F0 (was F2_momentum_hold): the multi-day shares hold, disabled after its daily test. F2 is now the debit-spread book.
  F0_momentum_hold: {enabled: false, paper_only: true, note: "multi-day hold after a high-volume up day: no edge in the 2013-18 daily test (best t 1.31 vs Bonferroni 2.96)"}
  # Book F2: single-name call and put debit spreads, paper only (research/strategy_f2_prereg.md; Evan, 2026-09-29).
  # C: call spread on F1's opening-range breakout (F2's names, green, RVOL5 >= 2), bought on the OR-high break before
  # 10:30 ET, held up to 3 days. P: put spread at 15:40 ET on a name up >= 3% on >= 1.8x average volume, held to the
  # next day's 15:40 ET. Nearest expiry 5-12 days out; long leg at the money, short leg one straddle-width out (>= 2
  # strikes); skip above 60% debit/width. Exits: 2x debit or 80% of width, stop 0.5x debit, C's day-1 stop below the
  # OR low, the time exit. Never held through a report. Limits (Evan, 2026-09-29): $750 max debit, 3 open, -$300 day.
  F2_debit_spreads: {enabled: true, paper_only: true,
                     universe: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, JPM, V, MA, UNH, XOM, LLY, COST, NFLX,
                                AMD, ORCL, CRM, ADBE, BAC, WMT, HD, DIS, INTC, QCOM, MU, PLTR, SMCI, ARM, MRVL, COIN,
                                UBER, SHOP],
                     rvol5_min: 2.0, max_armed_c: 3, entry_cutoff_et: "10:30", trigger_poll_sec: 2,
                     entry_p_et: "15:40", up_pct_p: 3.0, vol_ratio_p: 1.8, max_new_p: 2,
                     hold_days_c: 3, exit_et_c: "15:30", exit_et_p: "15:40",
                     dte: [5, 12], width_straddle_x: 1.0, min_steps: 2, max_debit_width: 0.60,
                     max_leg_spread_pct: 0.08, tick_exempt: 0.05, fill_frac: 0.35,
                     take_profit_x: 2.0, take_profit_width: 0.80, stop_x: 0.50,
                     max_debit: 750, max_open: 3, max_new_day: 3, daily_loss: 300, poll_sec: 5, require_calendar: true}
  # Book G = research candidate F3 (research/strategies_new_prereg.md, rules frozen; Evan approved paper 2026-09-28).
  # 0DTE/1DTE SPY ATM call calendar, Mon-Thu when the next session is tomorrow. Correlates 0.84 with D: one bet, compare side by side.
  G_call_calendar: {enabled: true,  paper_only: true,  lots: 1, entry_ct: "09:00", entry_grace_min: 5, max_debit: 3.00, take_profit_pct: 0.25, stop_pct: 0.35, close_ct: "14:25"}

calendar:
  # 12:00 CT closes: entries stop 11:20, flatten 11:40. Full-day holidays need no entry (no prints = no trades).
  early_close: [2026-11-27, 2026-12-24, 2027-07-02, 2027-11-26, 2027-12-24]
  # NYSE full-day holidays; the Earnings desk counts trading days with these (book E's T-10 / T-3 / T-1 windows)
  holidays: [2026-11-26, 2026-12-25, 2027-01-01, 2027-01-18, 2027-02-15, 2027-03-26, 2027-05-31, 2027-06-18,
             2027-07-05, 2027-09-06, 2027-11-25, 2027-12-24]

server:
  host: 127.0.0.1         # localhost only; the dashboard controls also need the token in the printed link
  port: 8765
  token: null             # null = new random token each run (or set AGENTDESK_TOKEN in .env)

review:                   # after-hours dashboard: python -m agentdesk review (launchd com.agentdesk.review), read-only
  sessions_dir: ~/.agentdesk/sessions    # each paper/shadow/live run saves YYYY-MM-DD.snapshot.json + .events.jsonl here
  claims_dir: ~/.agentdesk/claims        # a run (and tools/paper_session.sh) claims the port here; review steps aside
  snapshot_every_sec: 60
  modes: [paper, shadow, live]           # sim runs are not saved

journal_path: ~/.agentdesk/journal.db
