name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"           # the Mac runs 3.12
          cache: pip
          cache-dependency-path: requirements.lock
      # requirements.lock pins every package (uv pip compile requirements.txt -o requirements.lock --python-version 3.12)
      - run: pip install -r requirements.lock
      - run: python -m pytest -q tests research/tests
